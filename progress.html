<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Writing Tracker">
<meta property="og:description" content="A book, in numbers. Follow my writing journey.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='2' fill='%23faf7f0'/><text x='8' y='12' text-anchor='middle' font-size='10' fill='%2322211f'>W</text></svg>">
<title>Writing Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --paper: #faf7f0;
    --paper-warm: #f5f0e6;
    --ink: #22211f;
    --ink-light: #5c5a55;
    --ink-faint: #b8b5ad;
    --accent: #8b6914;
    --green: #4a6741;
    --red: #9b4e43;
    --orange: #a0683a;
    --line: #e8e3d7;
    --transition-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    font-family: 'Crimson Text', 'Georgia', 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-size: 17px;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 28px;
    background-attachment: fixed;
    scroll-snap-type: y mandatory;
  }

  html { scroll-behavior: smooth; }

  section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
    position: relative;
    will-change: transform;
    overflow: hidden;
    scroll-snap-align: start;
  }
  section + section { border-top: 1px solid var(--line); }
  html { scroll-behavior: smooth; }
  .container { max-width: 600px; width: 100%; margin: 0 auto; }

  .chapter-num {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.8s var(--transition-ease), transform 0.8s var(--transition-ease);
  }
  .visible .chapter-num { opacity: 1; transform: translateY(0); }

  h2 {
    font-family: 'Crimson Text', 'Georgia', 'Times New Roman', serif;
    font-size: 2.2rem;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    color: var(--ink);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s 0.1s var(--transition-ease), transform 0.8s 0.1s var(--transition-ease);
  }
  .visible h2 { opacity: 1; transform: translateY(0); }
  h2 em { font-style: italic; color: var(--accent); }
  h1 em { font-style: italic; color: var(--accent); }
  em { font-style: italic; color: var(--accent); }
  h2 strong { font-weight: 400; }

  .sub {
    font-size: 1rem;
    color: var(--ink-light);
    font-style: italic;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.8s 0.2s var(--transition-ease), transform 0.8s 0.2s var(--transition-ease);
  }
  .visible .sub { opacity: 1; transform: translateY(0); }

  .note {
    color: var(--ink-light);
    font-style: italic;
    max-width: 420px;
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 0.95rem;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.8s 0.5s var(--transition-ease), transform 0.8s 0.5s var(--transition-ease);
  }
  .visible .note { opacity: 1; transform: translateY(0); }
  .note em { font-style: italic; color: var(--accent); }

  .reveal {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.7s var(--transition-ease), transform 0.7s var(--transition-ease);
  }
  .visible .reveal { opacity: 1; transform: translateY(0); }
  .reveal-d1 { transition-delay: 0.15s; }
  .reveal-d2 { transition-delay: 0.25s; }
  .reveal-d3 { transition-delay: 0.35s; }
  .reveal-d4 { transition-delay: 0.45s; }
  .reveal-d5 { transition-delay: 0.55s; }

  .big-number {
    font-family: 'Crimson Text', serif;
    font-size: clamp(3.5rem, 9vw, 6rem);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1s 0.05s var(--transition-ease), transform 1s 0.05s var(--transition-ease);
  }
  .visible .big-number { opacity: 1; transform: translateY(0); }
  .big-number em { font-style: italic; color: var(--accent); }

  .stat-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 1.1rem;
  }
  .stat-line .num {
    font-family: 'Crimson Text', serif;
    font-size: 1.1rem;
    color: var(--accent);
    min-width: 100px;
    text-align: right;
  }
  .stat-line .lbl {
    font-size: 1.1rem;
    color: var(--ink-light);
  }


  .chapter-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .chapter-item {
    background: var(--paper);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .chapter-item .title {
    flex: 1;
    font-size: 0.95rem;
    font-style: italic;
    color: var(--ink);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chapter-item .bar {
    width: 100px;
    height: 2px;
    background: var(--line);
    position: relative;
  }
  .chapter-item .bar span {
    position: absolute;
    left: 0; top: 0; height: 100%;
    background: var(--accent);
    transition: width 1.2s var(--transition-ease);
  }
  .chapter-item .num {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 0.65rem;
    color: var(--ink-faint);
    min-width: 75px;
    text-align: right;
  }
  .chapter-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; background: var(--paper); border-left: 2px solid var(--accent); font-size: 0.7rem; }
  .detail-item { display: flex; flex-direction: column; }
  .detail-val { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .detail-lbl { color: var(--ink-faint); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.04em; }

  .card-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 8px; margin-bottom: 12px; }
  .card-cell { background: var(--paper); padding: 14px 8px; text-align: center; position: relative; }
  .card-cell .val { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; font-weight: 500; position: relative; }
  .card-cell .pages { font-size: 0.65rem; color: var(--ink); margin-top: 2px; position: relative; }

  .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; }
  .pagination button { background: none; border: 1px solid var(--line); color: var(--ink-faint); padding: 4px 12px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; }
  .pagination button:hover { border-color: var(--accent); color: var(--accent); }
  .pagination button:disabled { opacity: 0.3; cursor: default; }

  .metric-line { position: relative; height: 52px; margin: 10px 0 18px; }

  .card { background: var(--paper); padding: 16px; border: 1px solid var(--line); margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metric-line .track { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
  .metric-line .fill { position: absolute; left: 0; top: 50%; height: 1px; background: var(--ink); }
  .metric-line .marker { position: absolute; top: 50%; margin-left: -4px; margin-top: -5px; width: 8px; height: 10px; background: var(--ink); }
  .metric-line .mark-label { position: absolute; top: 50%; margin-top: -18px; font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--ink); transform: translateX(-50%); }
  .metric-line .ref { position: absolute; top: 50%; margin-top: -6px; width: 1px; height: 12px; background: var(--ink-faint); }
  .metric-line .ref-label { position: absolute; font-family: 'IBM Plex Mono', monospace; font-size: 0.45rem; color: var(--accent); white-space: nowrap; line-height:1.3; }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 0.65rem;
    padding: 4px 10px;
    border: 1px solid var(--line);
    color: var(--ink-light);
    letter-spacing: 0.04em;
    background: var(--paper);
    transition: border-color 0.4s ease, color 0.4s ease;
  }
  .chip.good { border-color: #c0d6b8; color: var(--green); }
  .chip.warn { border-color: #e8d4b8; color: var(--orange); }
  .chip.bad { border-color: #e8c0b8; color: var(--red); }

  .chart-wrap { margin-top: 28px; width: 100%; }
  .chart-wrap canvas { max-height: 200px; }

  .top-actions { position: fixed; top: 16px; right: 16px; z-index: 101; display: flex; gap: 8px; }
  .top-actions button {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-light);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    padding: 4px 10px;
    cursor: pointer;
    letter-spacing: 0.06em;
  }
  .top-actions button:hover { border-color: var(--accent); color: var(--accent); }

  .sparkline {
    display: inline-flex;
    align-items: flex-end;
    gap: 1px;
    height: 24px;
    margin-left: 12px;
    vertical-align: middle;
  }
  .sparkline span {
    width: 3px;
    background: var(--ink-faint);
    min-height: 2px;
    border-radius: 1px;
  }

  .meta-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
    margin-top: 12px;
  }

  .share-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    padding: 4px 10px;
    cursor: pointer;
    letter-spacing: 0.06em;
  }
  .share-btn:hover { border-color: var(--accent); color: var(--accent); }

  .heat-cell {
    width: 13px;
    height: 13px;
    border-radius: 2px;
    background: var(--line);
  }
  .heat-cell.on { background: var(--accent); }

  .heat-legend {
    display: flex;
    gap: 3px;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.55rem;
    color: var(--ink-faint);
    margin-top: 10px;
  }

  body.dark {
    --paper: #191410;
    --paper-warm: #211c16;
    --ink: #d4c5a9;
    --ink-light: #8a7e6b;
    --ink-faint: #5a5040;
    --accent: #c9a96e;
    --green: #7a9a6e;
    --red: #b0685c;
    --orange: #c4956a;
    --line: #2d261e;
    background-image: linear-gradient(var(--line) 1px, transparent 1px);
  }

  .scroll-progress {
    position: fixed;
    right: 0; top: 0;
    width: 1px;
    height: 100%;
    background: var(--line);
    z-index: 100;
  }
  .scroll-progress .thumb {
    width: 100%;
    background: var(--accent);
    transition: height 0.15s linear;
  }

  @media (max-width: 640px) {
    section { padding: 48px 16px; min-height: 100vh; }
    .big-number { font-size: 2.8rem; }
    h2 { font-size: 1.6rem; }
    .scroll-progress { display: none; }
    .metric-line { height: 44px; margin: 14px 0 24px; }
    body { background-size: 100% 24px; }
  }
</style>
</head>
<body>

<div class="scroll-progress"><div class="thumb" id="scroll-thumb"></div></div>
<div class="top-actions">
<button type="button" onclick="toggleTheme()">dark</button>
<button type="button" onclick="share()" title="Share">↗</button>
</div>
<div id="app"><div style="text-align:center;padding:80px 0;color:var(--ink-faint);font-style:italic;">Loading...</div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
// __PROGRESS_JSON__

let progress = null;
let expandedChapters = new Set();
let chapterPage = 0;

function toggleChapter(path) {
  if (expandedChapters.has(path)) expandedChapters.delete(path);
  else expandedChapters.add(path);
  render();
}

function toggleTheme() {
  const btn = document.querySelector('.top-actions button');
  document.body.classList.toggle('dark');
  btn.textContent = document.body.classList.contains('dark') ? 'light' : 'dark';
  // Redraw charts with new colors
  if (progress) {
    const d = progress;
    const days = d.days;
    const totalWords = days[days.length - 1].totalWords;
    renderProgressChart(days, totalWords, d);
    renderHoursChart();
  }
}

function share() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: 'Writing Tracker', url });
  } else {
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.querySelector('.share-btn');
      btn.textContent = 'copied';
      setTimeout(() => btn.textContent = 'share', 2000);
    });
  }
}

function refresh() {
  try {
    if (typeof __PROGRESS_JSON__ === 'undefined') throw new Error('No data. Run: pnpm extract');
    progress = __PROGRESS_JSON__;
    render();
  } catch (err) {
    document.getElementById('app').innerHTML = `<div style="text-align:center;padding:80px 0;color:var(--red);font-style:italic;">${err.message}</div>`;
  }
}

const fmt = (n) => n.toLocaleString();
const pp = (w) => Math.round(w / (progress.wordsPerPage || 300));
const getLatestStats = () => {
  for (let i = progress.days.length - 1; i >= 0; i--) {
    if (progress.days[i].textStats) return progress.days[i].textStats;
  }
  return null;
};

function buildHero(d, days, totalWords, est, sectionGoal, dailyAvg) {
  const author = d.authorName || 'I';
  const lastUpdated = new Date().toISOString().slice(0, 10);
  const sparkData = days.map(d => d.totalWords);
  const sparkMax = Math.max(...sparkData, 1);
  return `
    <section>
      <div class="container fade" style="text-align:center;">
        <h1 style="font-size:2.8rem;font-weight:400;letter-spacing:-0.02em;margin-bottom:8px;color:var(--ink);">${author.split(' ')[0]} Writes a <em>Book</em></h1>
        <p style="color:var(--ink-light);font-style:italic;font-size:1.1rem;margin-bottom:48px;">Follow my writing journey</p>
      </div>
    </section>

    <section>
      <div class="container fade">
        <div class="chapter-num">A book, in numbers</div>
        <div class="big-number">${fmt(totalWords)} <em>words</em>
          <span class="sparkline">${sparkData.slice(-30).map(v => `<span style="height:${Math.max(v/sparkMax*24, 2)}px"></span>`).join('')}</span>
        </div>
        <div style="font-size:2.4rem;font-weight:400;margin-bottom:4px;">${pp(totalWords)} <em>pages</em></div>
        <div class="sub">${days.length} days of writing</div>
        <div class="meta-row">
          <span>updated ${lastUpdated}</span>
        </div>
        <p class="note">At this pace, I finish by ${est.paced || '--'}. The book stands at ${pp(totalWords)} pages. ${pp(sectionGoal - totalWords)} to go.</p>
      </div>
    </section>`;
}

function buildProgress(d, totalWords, sectionGoal, dailyAvg, est) {
  const pct = Math.round(totalWords / sectionGoal * 100);
  return `
    <section>
      <div class="container fade">
        <div class="chapter-num">Chapter I</div>
        <h2>The <strong>${pct}%</strong> <em>mark</em></h2>
        <div class="sub">${fmt(totalWords)} of ${fmt(sectionGoal)} toward the final page</div>
        <div class="reveal reveal-d1"><div class="chart-wrap"><canvas id="progressChart"></canvas></div></div>
        <p class="note">${fmt(totalWords)} words written of ${fmt(sectionGoal)}. I am ${pct}% through. ${fmt(sectionGoal - totalWords)} words remain.<br><br>At this pace I finish by <em>${est.paced || '--'}</em>. On daily goal, by <em>${est.onTrack || '--'}</em>.</p>
      </div>
    </section>`;
}

function buildSessions(dailyAvg) {
  const days = progress.days;
  const recent = days.slice(-10);
  if (!recent.length) return '';
  return `
    <section>
      <div class="container fade">
        <div class="chapter-num">Chapter II</div>
        <h2><em>Recent</em> <strong>sessions</strong></h2>
        <div class="sub">Last ${recent.length} writing days</div>
        <div class="reveal reveal-d1"><div class="chart-wrap"><canvas id="sessionsChart"></canvas></div></div>
        <p class="note">I average <em>${fmt(dailyAvg)}</em> words per day across ${days.length} sessions.</p>
      </div>
    </section>`;
}

function buildStyle(d, stats, t, dailyAvg) {
  if (!stats) {
    return `
    <section>
      <div class="container fade">
        <div class="chapter-num">Chapter IV</div>
        <h2>The <em>craft</em> of <strong>prose</strong></h2>
        <div class="sub">No manuscript data yet</div>
      </div>
    </section>`;
  }

  const metrics = [
    { key: 'sentenceLengthAvg', label: 'Sentence length', value: Math.round(stats.sentenceLengthAvg), unit: 'w', domain: [0, 45],
      marks: [{ v: 10, n: 'Hemingway' }, { v: 15, n: 'King' }, { v: 22, n: 'Austen' }, { v: 38, n: 'Faulkner' }],
      note: m => `My sentences average <em>${m.value}${m.unit}</em>. Hemingway at 10, King at 15, Austen at 22, Faulkner at 38. Short sentences create urgency. Long ones build atmosphere.` },
    { key: 'lix', label: 'LIX readability', value: Math.round(stats.lix), unit: '', domain: [20, 65],
      marks: [{ v: 25, n: 'Potter' }, { v: 30, n: 'Da Vinci' }, { v: 45, n: 'NYT' }, { v: 58, n: 'Academic' }],
      note: m => `My LIX is <em>${m.value}</em>. Potter at 25, Da Vinci at 30, NYT at 45, Academic at 58. LIX measures readability: lower means easier to read, higher means complex sentences.` },
    { key: 'dialogueRatio', label: 'Dialogue', value: Math.round(stats.dialogueRatio), unit: '%', domain: [0, 100],
      marks: [{ v: 15, n: 'McCarthy' }, { v: 30, n: 'Tolkien' }, { v: 40, n: 'Rowling' }, { v: 60, n: 'Hemingway' }],
      note: m => `<em>${m.value}%</em> of my lines are dialogue. McCarthy at 15%, Tolkien 30%, Rowling 40%, Hemingway 60%. Dialogue-heavy scenes move faster. Low dialogue means more narration.` },
    { key: 'passiveRatio', label: 'Passive voice', value: Math.round(stats.passiveRatio), unit: '', domain: [0, 5],
      marks: [{ v: 1, n: 'Hemingway' }, { v: 2, n: 'Rowling' }, { v: 4, n: 'NYT' }, { v: 5, n: 'Academic' }],
      note: m => `<em>${m.value}</em> passives per 1000 words. Hemingway at 1, Rowling at 2, NYT at 4, Academic at 5. Passive voice obscures who acts. Active voice is direct and clear.` },
    { key: 'adverbRatio', label: 'Adverbs', value: Math.round(stats.adverbRatio), unit: '', domain: [0, 18],
      marks: [{ v: 2, n: 'McCarthy' }, { v: 5, n: 'King' }, { v: 10, n: 'Rowling' }, { v: 15, n: 'E.L. James' }],
      note: m => `<em>${m.value}</em> adverbs per 1000 words. McCarthy at 2, King at 5, Rowling at 10, E.L. James at 15. Adverbs prop up weak verbs. A strong verb needs no modifier.` },
    { key: 'ttr', label: 'Vocab range', value: Math.round(stats.ttr), unit: '', domain: [30, 90],
      marks: [{ v: 35, n: 'Simple' }, { v: 44, n: 'Avg fiction' }, { v: 55, n: 'Hemingway' }, { v: 70, n: 'Joyce' }],
      note: m => `My range is <em>${m.value}</em>. Simple prose at 35, average fiction at 44, Hemingway at 55, Joyce at 70. Higher means less repetition, richer vocabulary.` },
    { key: 'sentimentPolarity', label: 'Sentiment', value: Math.round(stats.sentimentPolarity), unit: '', domain: [-100, 100],
      marks: [{ v: -40, n: 'Tragedies' }, { v: -10, n: 'Noir' }, { v: 10, n: 'Dramas' }, { v: 30, n: 'Comedies' }],
      note: m => `My sentiment score is <em>${m.value}</em>. Tragedies at −40, Noir at −10, Dramas at +10, Comedies at +30. Negative is darker, positive is lighter.` },
    { key: 'editRatio', label: 'Rewriting', value: d.editRatio, unit: '%', domain: [0, 35],
      marks: [{ v: 5, n: 'Draft' }, { v: 12, n: 'Revision' }, { v: 20, n: 'Edit' }, { v: 30, n: 'Polish' }],
      note: m => `<em>${m.value}%</em> of my word count is rewriting. Draft at 5%, Revision at 12%, Edit at 20%, Polish at 30%. High means heavy editing. Low means fresh drafting.` },
  ];

  const chapters = ['IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];

  // Add daily writing metric
  if (progress.days.length > 0) {
    metrics.push({
      key: 'dailyWriting', label: 'Daily writing', value: dailyAvg, unit: 'w', domain: [0, 2800],
      marks: [{ v: 500, n: 'Hemingway' }, { v: 1000, n: 'Rowling' }, { v: 2000, n: 'King' }, { v: 2500, n: 'Sanderson' }],
      note: m => `I write <em>${m.value}</em> words per day. Hemingway at 500, Rowling at 1000, King at 2000, Sanderson at 2500. Pace is personal. Showing up is what counts.`,
    });
  }

  const metricChapters = ['V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII'];

  return metrics.map((m, i) => {
    const pct = Math.min((m.value - m.domain[0]) / (m.domain[1] - m.domain[0]) * 100, 100);
    return `
    <section>
      <div class="container fade">
        <div class="chapter-num">Chapter ${metricChapters[i]}</div>
        <h2><em>${m.label}</em></h2>
        <div class="metric-line">
            <div class="track"></div>
            <div class="fill" style="width:${pct}%"></div>
            <div class="marker" style="left:${pct}%"></div>
            <div class="mark-label" style="left:${pct}%">${m.value}${m.unit}</div>
            ${m.marks.map(mk => {
              const rpct = (mk.v - m.domain[0])/(m.domain[1] - m.domain[0])*100;
              return `<div class="ref" style="left:${rpct}%"></div><div class="ref-label" style="left:${rpct}%;top:31px;text-align:center;"><span style="display:block;">${mk.n}</span><span style="display:block;font-size:0.4rem;">${mk.v}${m.unit}</span></div>`;
            }).join('')}
          </div>
        <p class="note">${m.note(m)}</p>
      </div>
    </section>`;
  }).join('');
}

function buildChapters(d) {
  const chapters = d.chapterWordCounts || {};
  const stats = d.chapterStats || {};
  const target = d.chapterTargetWords || 2500;
  const PAGE_SIZE = 10;
  const sorted = Object.entries(chapters).sort((a,b) => a[0].localeCompare(b[0]));
  const totalPages = Math.ceil(sorted.length / PAGE_SIZE);
  const page = Math.min(chapterPage, totalPages - 1);
  const slice = sorted.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
  const mItem = (lbl, val) => `<div class="detail-item"><span class="detail-val">${val}</span><span class="detail-lbl">${lbl}</span></div>`;
  const pager = totalPages > 1 ? `
            <div class="pagination">
              <button type="button" onclick="chapterPage=Math.max(0,chapterPage-1);render()" ${page===0?'disabled':''}>← prev</button>
              <span>${page+1} / ${totalPages}</span>
              <button type="button" onclick="chapterPage=Math.min(${totalPages-1},chapterPage+1);render()" ${page===totalPages-1?'disabled':''}>next →</button>
            </div>` : '';
  const chapterRow = (path, wc) => {
    const name = path.split('/').pop().replace(/\.[^.]+$/,'');
    const cpct = Math.min(Math.round(wc / target * 100), 100);
    const s = stats[path] || {};
    const details = expandedChapters.has(path) ? `
              <div class="chapter-details">
                ${mItem('LIX', s.lix || '—')}
                ${mItem('Dialogue', `${s.dialogueRatio || 0}%`)}
                ${mItem('S-Len', s.sentenceLengthAvg || '—')}
                ${mItem('Passive', s.passiveRatio || '—')}
                ${mItem('Adverbs', s.adverbRatio || '—')}
                ${mItem('TTR', s.ttr || '—')}
                ${mItem('Sentiment', s.sentimentPolarity || '—')}
              </div>` : '';
    return `
              <div class="chapter-row">
                <div class="chapter-item" onclick="toggleChapter('${path}')">
                  <span class="title">${name}</span>
                  <div class="bar"><span style="width:${cpct}%"></span></div>
                  <span class="num">${fmt(wc)} w &middot; ${pp(wc)} pp</span>
                </div>
                ${details}
              </div>`;
  };
  return `
    <section>
      <div class="container fade">
        <div class="chapter-num">Chapter XIII</div>
        <h2><em>Chapters</em> taking <strong>shape</strong></h2>
        <div class="sub">Each measured against the ${target}-word ideal</div>
        ${Object.keys(chapters).length ? `
        <div class="reveal reveal-d1">
          <div class="chapter-list">
            ${slice.map(([path, wc]) => chapterRow(path, wc)).join('')}
          </div>
          ${pager}
        </div>
        ` : '<div class="sub">No chapter data yet</div>'}
        <p class="note">${Object.keys(chapters).length} chapters tracked. Target is ${target} words each. ${Object.values(chapters).filter(w => w >= target).length} hit the mark.</p>
      </div>
    </section>`;
}

function buildHabits() {
  return `
    <section>
      <div class="container fade">
        <div class="chapter-num">Chapter XIV</div>
        <h2><em>When</em> I <strong>write</strong></h2>
        <div class="reveal reveal-d1"><div class="chart-wrap"><canvas id="hoursChart"></canvas></div></div>
        <p class="note" style="margin-top:12px;">Morning 04–08 &middot; Noon 08–12 &middot; Afternoon 12–18 &middot; Evening 18–22 &middot; Night 22–04</p>
      </div>
    </section>
    <section>
      <div class="container fade">
        <div class="chapter-num">Chapter XV</div>
        <h2><em>Which</em> days I <strong>show up</strong></h2>
        <div class="reveal reveal-d1"><div id="dayBoxes"></div></div>
        <p class="note" style="margin-top:12px;">A glimpse of which days I show up at the desk. Consistency over intensity.</p>
      </div>
    </section>`;
}

function renderDayBoxes() {
  const el=document.getElementById('dayBoxes');
  if(!el)return;
  const dayShort=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dayCounts=[0,0,0,0,0,0,0];
  for(const day of progress.days){const d=new Date(day.date).getDay();dayCounts[d]++;}
  const max=Math.max(...dayCounts,1);
  el.innerHTML=`<div class="card-grid">${dayShort.map((name,i)=>{const intensity=dayCounts[i]/max;return`<div class="card-cell"><div style="position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--accent);opacity:${(intensity*0.35).toFixed(2)};"></div><div class="val">${name}</div><div class="pages">${dayCounts[i]}</div></div>`}).join('')}</div>`;
}

function render() {
  if (!progress?.days.length) {
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:80px 0;color:var(--ink-faint);font-style:italic;">No data yet. Run <code>pnpm extract</code>.</div>';
    return;
  }

  const d = progress;
  const days = d.days;
  // Use chapter word counts for accurate current state
  const chapterWords = Object.values(d.chapterWordCounts || {}).reduce((a, b) => a + b, 0);
  const totalWords = chapterWords || (days.length > 0 ? days[days.length - 1].totalWords : 0);
  const est = d.estimatedFinish || {};
  const sectionGoal = d.totalGoal;
  const firstDate = new Date(days[0].date);
  const lastDate = new Date(days[days.length - 1].date);
  const calendarDays = Math.round((lastDate - firstDate) / 86400000) + 1;
  const dailyAvg = Math.round(totalWords / calendarDays);
  const stats = getLatestStats();
  const t = d.thresholds || {};

  document.getElementById('app').innerHTML =
    buildHero(d, days, totalWords, est, sectionGoal, dailyAvg) +
    buildProgress(d, totalWords, sectionGoal, dailyAvg, est) +
    buildSessions(dailyAvg) +
    buildChapters(d) +
    buildStyle(d, stats, t, dailyAvg) +
    buildHabits();

  renderProgressChart(days, totalWords, { ...d, totalGoal: sectionGoal });
  renderSessionsChart();
  renderHoursChart();
  renderDayBoxes();
  setupReveal();
}

function renderProgressChart(days, totalWords, d) {
  const ctx = document.getElementById('progressChart');
  if (!ctx) return;
  const dark = document.body.classList.contains('dark');
  const ink = dark ? '#d4c5a9' : '#22211f';
  const grid = dark ? '#2d261e' : '#e8e3d7';
  const faint = dark ? '#c9a96e' : '#8b6914';
  const goalCol = dark ? '#3a3228' : '#d8d3c7';
  const greenCol = dark ? '#7a9a6e33' : '#c0d6b8';
  const goldCol = faint + '66';
  const labels = days.map(d => d.date);
  const paceBase = d.dailyGoal;
  const est = d.estimatedFinish || {};
  const dailyAvg = totalWords / days.length;
  const extLabels = [...labels];
  const extActual = days.map(d => d.totalWords);
  const extGoal = days.map((_, i) => paceBase * (i + 1));
  const extPace = days.map((_, i) => paceBase * (i + 1));
  const lastDate = new Date(days[days.length - 1].date);
  const onTrackDate = est.onTrack ? new Date(est.onTrack) : null;
  const pacedDate = est.paced ? new Date(est.paced) : null;
  const endDate = (onTrackDate && pacedDate) ? new Date(Math.max(onTrackDate, pacedDate)) : (onTrackDate || pacedDate || new Date(Date.now() + 30*86400000));
  const cursor = new Date(lastDate); cursor.setDate(cursor.getDate() + 1);
  let pGoal = totalWords, pPace = totalWords;
  while (cursor <= endDate) {
    extLabels.push(cursor.toISOString().slice(0, 10));
    extActual.push(null);
    pGoal = Math.min(pGoal + paceBase, d.totalGoal);
    pPace = Math.min(pPace + dailyAvg, d.totalGoal);
    extGoal.push(pGoal); extPace.push(pPace);
    cursor.setDate(cursor.getDate() + 1);
  }
  Chart.getChart('progressChart')?.destroy();
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: extLabels,
      datasets: [
        { data: extActual, borderColor: ink, borderWidth: 2, pointRadius: 1.5, pointBackgroundColor: dark ? '#c9a96e' : '#8b6914', tension: 0.2, spanGaps: false },
        { data: extLabels.map(() => d.totalGoal), borderColor: goalCol, borderWidth: 1, borderDash: [4, 8], pointRadius: 0 },
        { data: extGoal, borderColor: greenCol, borderWidth: 1.5, borderDash: [2, 6], pointRadius: 0 },
        { data: extPace, borderColor: goldCol, borderWidth: 1.5, borderDash: [1, 8], pointRadius: 0 }
      ]
    },
    options: {
      responsive: true,
      animation: { duration: 1200, easing: 'easeInOutQuart' },
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: faint, maxTicksLimit: 8, font: { family: 'IBM Plex Mono', size: 9 } }, grid: { color: grid } },
        y: { beginAtZero: true, ticks: { color: faint, font: { family: 'IBM Plex Mono', size: 9 }, callback: v => v >= 1000 ? v / 1000 : v }, grid: { display: false } }
      }
    }
  });
}

function renderSessionsChart() {
  const ctx = document.getElementById('sessionsChart');
  if (!ctx) return;
  const dark = document.body.classList.contains('dark');
  const ink = dark ? '#c9a96e' : '#8b6914';
  const grid = dark ? '#2d261e' : '#e8e3d7';
  const faint = dark ? '#c9a96e' : '#8b6914';
  const recent = progress.days.slice(-10);
  Chart.getChart('sessionsChart')?.destroy();
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: recent.map(d => d.date.slice(5)),
      datasets: [{
        data: recent.map(d => d.wordsNet),
        backgroundColor: recent.map(d => d.wordsNet > 0 ? ink : grid),
        borderWidth: 0, borderRadius: 0
      }]
    },
    options: {
      responsive: true,
      animation: { duration: 800, easing: 'easeInOutQuart' },
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: faint, font: { family: 'IBM Plex Mono', size: 9 } }, grid: { display: false } },
        y: { ticks: { color: faint, font: { family: 'IBM Plex Mono', size: 9 } }, grid: { color: grid } }
      }
    }
  });
}

function renderHoursChart() {
  const ctx = document.getElementById('hoursChart');
  if (!ctx) return;
  const dark = document.body.classList.contains('dark');
  const ink = dark ? '#c9a96e' : '#8b6914';
  const grid = dark ? '#2d261e' : '#e8e3d7';
  const faint = dark ? '#c9a96e' : '#8b6914';
  const hours = progress.commitHours || {};
  const bins = [
    { label: 'Morning', range: [4, 5, 6, 7] },
    { label: 'Noon', range: [8, 9, 10, 11] },
    { label: 'Afternoon', range: [12, 13, 14, 15, 16, 17] },
    { label: 'Evening', range: [18, 19, 20, 21] },
    { label: 'Night', range: [22, 23, 0, 1, 2, 3] },
  ];
  const data = bins.map(b => b.range.reduce((s, h) => s + (hours[h] || 0), 0));
  const timeRanges = { Morning: '04–08', Noon: '08–12', Afternoon: '12–18', Evening: '18–22', Night: '22–04' };
  Chart.getChart('hoursChart')?.destroy();
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: bins.map(b => b.label),
      datasets: [{
        data,
        backgroundColor: data.map(d => d > 0 ? ink : grid),
        borderWidth: 0, borderRadius: 0
      }]
    },
    options: {
      responsive: true,
      animation: { duration: 800, easing: 'easeInOutQuart' },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => timeRanges[ctx.label] || ctx.label } } },
      scales: {
        x: { ticks: { color: faint, font: { family: 'IBM Plex Mono', size: 9 } }, grid: { display: false } },
        y: { ticks: { color: faint, font: { family: 'IBM Plex Mono', size: 9 } }, grid: { color: grid } }
      }
    }
  });
}

function setupReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.25, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.fade').forEach(el => { observer.observe(el); });

  const thumb = document.getElementById('scroll-thumb');
  if (thumb) {
    window.addEventListener('scroll', () => {
      const h = document.documentElement;
      const pct = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
      thumb.style.height = `${Math.min(pct, 100)}%`;
    }, { passive: true });
  }
}

refresh();

      </div>
    </section>
