<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d2991d;
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
  h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 8px; }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: 0.85rem;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .stat-value { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; }
  .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.orange .stat-value { color: var(--orange); }
  .stat-card.red .stat-value { color: var(--red); }
  .charts {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; margin-bottom: 24px;
  }
  @media (max-width: 768px) { .charts { grid-template-columns: 1fr; } }
  .chart-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .chart-box canvas { width: 100% !important; max-height: 300px; }
  .section-bar {
    display: flex; gap: 4px; margin-bottom: 24px; height: 8px; border-radius: 4px; overflow: hidden;
  }
  .section-bar span { height: 100%; border-radius: 0; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .detail-table th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .detail-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); }
  .detail-table tr:hover td { background: rgba(255,255,255,0.03); }
  .detail-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .drilldown { margin-bottom: 24px; }
  .section-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
  .section-tab {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 4px 12px; border-radius: var(--radius); cursor: pointer; font-size: 0.8rem;
  }
  .section-tab.active { border-color: var(--accent); color: var(--accent); }
  .settings-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 24px; display: none;
  }
  .settings-panel.open { display: block; }
  .setting-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .setting-row label { width: 160px; font-size: 0.85rem; color: var(--text-muted); }
  .setting-row input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: var(--radius); font-size: 0.9rem; width: 160px;
  }
  .has-tip { cursor: help; position: relative; }
  .has-tip .tip {
    display: none; position: fixed; background: #1c2128; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px; width: 280px; max-width: calc(100vw - 16px); z-index: 100;
    font-size: 0.75rem; line-height: 1.5; color: var(--text); pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    white-space: normal; word-wrap: break-word; overflow-wrap: break-word; font-weight: 400;
  }
  .has-tip:hover .tip { display: block; }
  .tip b { color: var(--accent); }
  .tip .bench { color: var(--text-muted); font-size: 0.7rem; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 4px; line-height: 1.6; }
  .setting-row input:focus { outline: none; border-color: var(--accent); }
  .setting-val { color: var(--text); font-size: 0.85rem; }
  .c-green { color: var(--green); }
  .c-orange { color: var(--orange); }
  .c-red { color: var(--red); }
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: var(--radius); font-size: 0.85rem;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 60px 0; color: var(--text-muted); }
  .error-state { text-align: center; padding: 60px 0; }
  .error-state p { color: var(--red); margin-bottom: 12px; }

  /* Hero */
  .hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
  .hero-main { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .hero-count { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; }
  .hero-label { font-size: 0.9rem; color: var(--text-muted); }
  .hero-bar-wrap { margin-bottom: 14px; }
  .hero-bar { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
  .hero-bar-fill { height: 100%; background: linear-gradient(90deg, #3fb950, #58a6ff); border-radius: 4px; transition: width 0.5s; }
  .hero-bar-pct { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
  .hero-stats { display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-muted); }
  .hero-stats span { white-space: nowrap; }
  .hero-stats i { font-style: normal; opacity: 0.6; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; margin: 16px 0; border-bottom: 2px solid var(--border); }
  .tab { background: none; border: none; color: var(--text-muted); padding: 8px 20px; cursor: pointer; font-size: 0.85rem; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Metric strip */
  .metric-strip { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 4px; font-size: 0.78rem; color: var(--text-muted); align-items: center; position: relative; }
  .metric-strip span { white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 1px; vertical-align: middle; background: var(--text-muted); }
  .dot-g { background: var(--green); }
  .dot-o { background: var(--orange); }
  .dot-r { background: var(--red); }

  /* Mobile */
  @media (max-width: 768px) {
    body { padding: 12px; }
    h1 { font-size: 1.25rem; }
    .top-bar { gap: 8px; }
    .hero { padding: 16px; }
    .hero-count { font-size: 1.8rem; }
    .hero-stats { gap: 10px; font-size: 0.7rem; }
    .tab { padding: 6px 14px; font-size: 0.78rem; }
    .metric-strip { gap: 8px; font-size: 0.7rem; padding: 8px 12px; }
    .stats { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
    .stat-card { padding: 12px; }
    .stat-value { font-size: 1.35rem; }
    .stat-label { font-size: 0.7rem; }
    .charts { grid-template-columns: 1fr; gap: 12px; }
    .chart-box { padding: 12px; }
    .chart-box canvas { max-height: 220px; }
    .has-tip .tip { width: 240px; font-size: 0.7rem; padding: 8px 10px; }
    .section-tabs { gap: 2px; }
    .section-tab { padding: 3px 8px; font-size: 0.7rem; }
    .detail-table { font-size: 0.7rem; }
    .detail-table th, .detail-table td { padding: 4px 6px; }
    .setting-row { flex-wrap: wrap; gap: 6px; }
    .setting-row label { width: 100%; }
    .settings-panel { padding: 14px; }
    .drilldown { overflow-x: auto; }
    .chapter-bar { flex-wrap: wrap; }
  }
</style>
</head>

// ── Init ──
function refresh() {
  document.getElementById('app').innerHTML = '<div class="loading">Loading…</div>';
  try {
    if (typeof __PROGRESS_JSON__ === 'undefined') {
      throw new Error('No data embedded. Run: pnpm extract');
    }
    progress = __PROGRESS_JSON__;
    render();
  } catch (err) {
    document.getElementById('app').innerHTML =
      `<div class="error-state"><p>${err.message}</p></div>`;
  }
}

function render() {
  if (!progress || !progress.days.length) {
    document.getElementById('app').innerHTML = '<div class="loading">No data yet. Run <code>pnpm extract</code>.</div>';
    return;
  }
  assignSectionColors();
  if (selectedFile) {
    document.getElementById('app').innerHTML = buildFileDetail();
    renderFileDetailCharts();
  } else {
    document.getElementById('app').innerHTML = buildHTML();
    renderCharts();
  }
}

function assignSectionColors() {
  const sections = Object.keys(progress.perSection || {});
  sections.forEach((s, i) => sectionColors[s] = COLORS[i % COLORS.length]);
  sectionColors['All'] = COLORS[0];
}

function buildFileTable() {
  // Collect all files across all days, deduped
  const fileMap = new Map();
  for (const day of progress.days) {
    for (const f of day.files) {
      if (activeSection !== 'all' && f.section !== activeSection) continue;
      if (!fileMap.has(f.path)) {
        fileMap.set(f.path, { path: f.path, section: f.section, added: 0, removed: 0, deleted: false });
      }
      const entry = fileMap.get(f.path);
      entry.added += f.wordsAdded;
      entry.removed += f.wordsRemoved;
      if (f.deleted) entry.deleted = true;
    }
  }
  const files = [...fileMap.values()].sort((a,b) => (b.added - b.removed) - (a.added - a.removed));
  if (!files.length) return '<p style="color:var(--text-muted);font-size:0.85rem;">No files in this section</p>';
  return `
    <div style="overflow-x:auto;">
    <table class="detail-table">
      <thead><tr><th>File</th><th>Section</th><th class="num">Added</th><th class="num">Removed</th><th class="num">Net</th></tr></thead>
      <tbody>
        ${files.map(f => `
          <tr style="cursor:pointer;${f.deleted ? 'opacity:0.4' : ''}" onclick="switchFile('${f.path.replace(/'/g, "\\'")}')">
            <td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${f.deleted ? 'text-decoration:line-through' : ''}" title="${f.path}${f.deleted ? ' (deleted)' : ''}">${f.path}</td>
            <td>${f.section}${f.deleted ? ' 🗑' : ''}</td>
            <td class="num" style="color:var(--green)">+${fmt(f.added)}</td>
            <td class="num" style="color:var(--red)">−${fmt(f.removed)}</td>
            <td class="num">${f.deleted ? '<span style="color:var(--text-muted)">deleted</span>' : fmt(f.added - f.removed)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>`;
}

function switchSection(section) {
  selectedFile = null;
  activeSection = activeSection === section ? 'all' : section;
  render();
}

function switchTab(tab) {
  activeTab = tab;
  // Re-render only tab content and charts to avoid full DOM rebuild
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().startsWith(tab)));
  document.querySelectorAll('.tab-content').forEach(el => { el.style.display = el.id === 'tab-' + tab ? '' : 'none'; });
  renderCharts();
}

function switchFile(path) {
  selectedFile = path;
  render();
}

// ── File detail view ──
function getFileDays(path) {
  const dayMap = new Map();
  for (const day of progress.days) {
    for (const f of day.files) {
      if (f.path !== path) continue;
      if (!dayMap.has(day.date)) {
        dayMap.set(day.date, { date: day.date, wordsAdded: 0, wordsRemoved: 0, totalWords: 0, textStats: null });
      }
      const d = dayMap.get(day.date);
      d.wordsAdded += f.wordsAdded;
      d.wordsRemoved += f.wordsRemoved;
      if (f.textStats) d.textStats = f.textStats;
    }
  }
  const days = [...dayMap.values()].sort((a, b) => a.date.localeCompare(b.date));
  let running = 0;
  for (const d of days) {
    running += d.wordsAdded - d.wordsRemoved;
    d.totalWords = running;
  }
  return days;
}

function getLatestFileStats(path) {
  for (let i = progress.days.length - 1; i >= 0; i--) {
    for (const f of progress.days[i].files) {
      if (f.path === path && f.textStats) return f.textStats;
    }
  }
  return null;
}

// ── Filtered day stats by section ──
function getFilteredDays() {
  if (activeSection === 'all') return progress.days;

  // Recompute per-day stats from files matching the section
  const dayMap = new Map();
  for (const day of progress.days) {
    const key = day.date;
    if (!dayMap.has(key)) {
      dayMap.set(key, { date: key, wordsAdded: 0, wordsRemoved: 0, totalWords: 0 });
    }
    const d = dayMap.get(key);
    for (const f of day.files) {
      if (f.section !== activeSection) continue;
      d.wordsAdded += f.wordsAdded;
      d.wordsRemoved += f.wordsRemoved;
    }
  }
  const days = [...dayMap.values()].sort((a, b) => a.date.localeCompare(b.date));
  let running = 0;
  for (const d of days) {
    running += d.wordsAdded - d.wordsRemoved;
    d.totalWords = running;
  }
  return days;
}

function renderCumulativeChart() {
  const ctx = document.getElementById('cumulativeChart');
  if (!ctx) return;
  const days = getFilteredDays();
  const labels = days.map(d => d.date);
  const totalWords = days.length > 0 ? days[days.length - 1].totalWords : 0;
  const isAll = activeSection === 'all';
  const goalTarget = isAll ? progress.totalGoal : Math.round(progress.totalGoal * (totalWords / (progress.totalWords || 1)));
  const paceBase = isAll ? progress.dailyGoal : Math.round(progress.dailyGoal * (totalWords / (progress.totalWords || 1)));
  const est = progress.estimatedFinish || {};

  // Build extended labels to later estimate date
  const today = new Date();
  const lastDate = days.length > 0 ? new Date(days[days.length - 1].date) : today;
  const onTrackDate = est.onTrack ? new Date(est.onTrack) : null;
  const pacedDate = est.paced ? new Date(est.paced) : null;
  const endDate = onTrackDate && pacedDate ? new Date(Math.max(onTrackDate, pacedDate)) : (onTrackDate || pacedDate || new Date(today.getTime() + 30*86400000));
  
  const extLabels = [...labels];
  const extActual = days.map(d => d.totalWords);
  const extGoalPace = days.map((_, i) => paceBase * (i + 1));
  const extCurrentPace = days.map((_, i) => paceBase * (i + 1)); // placeholder, recalc below
  
  // Current pace: average words/day so far
  const dailyAvg = days.length > 0 ? totalWords / days.length : paceBase;
  
  // Extend labels day by day from lastDate+1 to endDate
  const cursor = new Date(lastDate);
  cursor.setDate(cursor.getDate() + 1);
  let dIdx = days.length;
  let projGoal = totalWords; // projected at daily goal pace
  let projPace = totalWords; // projected at current pace
  
  while (cursor <= endDate) {
    const dateStr = cursor.toISOString().slice(0, 10);
    extLabels.push(dateStr);
    extActual.push(null); // no actual data beyond today
    projGoal = Math.min(projGoal + paceBase, goalTarget);
    projPace = Math.min(projPace + dailyAvg, goalTarget);
    extGoalPace.push(projGoal);
    extCurrentPace.push(projPace);
    cursor.setDate(cursor.getDate() + 1);
    dIdx++;
  }
  
  Chart.getChart('cumulativeChart')?.destroy();
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: extLabels,
      datasets: [
        {
          label: 'Total Words', data: extActual,
          borderColor: sectionColors[activeSection] || '#58a6ff', backgroundColor: (sectionColors[activeSection] || '#58a6ff') + '22',
          fill: true, tension: 0.3, pointRadius: 3, spanGaps: false
        },
        {
          label: 'Goal', data: extLabels.map(() => goalTarget),
          borderColor: '#d2991d', borderDash: [6, 4], pointRadius: 0, fill: false
        },
        {
          label: est.onTrack ? 'Daily Goal \u2192 ' + est.onTrack : 'Daily Goal Pace', data: extGoalPace,
          borderColor: '#3fb950', borderDash: [3, 6], pointRadius: 0, fill: false
        },
        {
          label: est.paced ? 'Current Pace \u2192 ' + est.paced : 'Current Pace', data: extCurrentPace,
          borderColor: '#58a6ff88', borderDash: [2, 8], pointRadius: 0, fill: false
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#8b949e', font: { size: 11 } } } },
      scales: {
        x: { ticks: { color: '#8b949e', maxTicksLimit: 14 }, grid: { color: '#21262d' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' }, title: { display: true, text: 'words', color: '#8b949e' } }
      }
    }
  });
}

function tip(key, value) {
  const m = METRIC_INFO[key]
  if (!m) return ''
  const level = getLevel(key, value)
  return `
  <span class="tip">
    <b>${m.name}</b><br>
    ${m.desc}<br><br>
    <b>Formula:</b> ${m.calc}<br>
    <b>Your score:</b> ${value} — <span style="color:${level.color}">${level.label}</span><br>
    <div class="bench"><b>Benchmarks:</b><br>${m.bench.replace(/ · /g, '<br>')}</div>
  </span>`
}

function getLevel(key, value) {
  const t = progress?.thresholds || {}
  const m = t[key]
  if (!m) return { label: '', color: 'var(--text-muted)' }
  if (m.goodMin !== undefined) {
    if (value >= m.goodMin && value <= m.goodMax) return { label: 'Good', color: 'var(--green)' }
    if (value >= m.warnMin && value <= m.warnMax) return { label: 'Warning', color: 'var(--orange)' }
    return { label: 'Needs attention', color: 'var(--red)' }
  }
  if (key === 'ttr') {
    if (value >= m.good) return { label: 'Good', color: 'var(--green)' }
    if (value >= m.warn) return { label: 'Warning', color: 'var(--orange)' }
    return { label: 'Needs attention', color: 'var(--red)' }
  }
  if (value <= m.good) return { label: 'Good', color: 'var(--green)' }
  if (value <= m.warn) return { label: 'Warning', color: 'var(--orange)' }
  return { label: 'Needs attention', color: 'var(--red)' }
}

// ── Compact metric strip ──
function buildMetricStrip() {
  const lastStats = getLatestTextStats();
  if (!lastStats) return '';
  const t = progress.thresholds || {};

  const cards = [
    { key: 'sentenceLengthAvg', label: 'Sentence Length', value: lastStats.sentenceLengthAvg, suffix: '' },
    { key: 'lix', label: 'LIX', value: lastStats.lix, suffix: '' },
    { key: 'dialogueRatio', label: 'Dialogue', value: lastStats.dialogueRatio, suffix: '%' },
    { key: 'passiveRatio', label: 'Passive /1000w', value: lastStats.passiveRatio, suffix: '' },
    { key: 'adverbRatio', label: 'Adverbs /1000w', value: lastStats.adverbRatio, suffix: '' },
    { key: 'ttr', label: 'TTR', value: lastStats.ttr, suffix: '' },
  ];

  const colorFn = (key, value) => key === 'ttr' ? metricColorInv(value, t[key]) : metricColor(value, t[key]);

  return `
  <h2 style="margin-bottom:4px;">${activeSection === 'all' ? 'Manuscript' : activeSection} Metrics</h2>
  <div class="stats" style="margin-bottom:16px;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));">
    ${cards.map(c => `
    <div class="stat-card has-tip ${colorFn(c.key, c.value)}" style="padding:10px 14px;">
      <div class="stat-value" style="font-size:1.25rem;">${c.value}${c.suffix}</div>
      <div class="stat-label" style="font-size:0.7rem;">${c.label}</div>
      ${tip(c.key, c.value)}
    </div>`).join('')}
    <div class="stat-card has-tip" style="padding:10px 14px;">
      <div class="stat-value" style="font-size:1.25rem;">${progress.editRatio}%</div>
      <div class="stat-label" style="font-size:0.7rem;">Edit Ratio</div>
      ${tip('editRatio', progress.editRatio)}
    </div>
  </div>`;
}
function metricColor(value, t) {
  if (!t) return '';
  // Range metric: goodMin/goodMax/warnMin/warnMax
  if (t.goodMin !== undefined) {
    if (value >= t.goodMin && value <= t.goodMax) return 'green';
    if (value >= t.warnMin && value <= t.warnMax) return 'orange';
    return 'red';
  }
  // Threshold metric: good/warn (lower is better for ratios)
  if (value <= t.good) return 'green';
  if (value <= t.warn) return 'orange';
  return 'red';
}

function metricColorInv(value, t) {
  // Inverted: higher is better (TTR)
  if (!t) return '';
  if (value >= t.good) return 'green';
  if (value >= t.warn) return 'orange';
  return 'red';
}

function getLatestTextStats() {
  // Find files with textStats in the active section across the latest day
  for (let i = progress.days.length - 1; i >= 0; i--) {
    const day = progress.days[i];
    if (activeSection === 'all') {
      if (day.textStats) return day.textStats;
    } else {
      const sectionFiles = day.files.filter(f => f.section === activeSection && f.textStats);
      if (sectionFiles.length > 0) {
        // Aggregate textStats from section files
        return aggregateTextStats(sectionFiles.map(f => f.textStats));
      }
    }
  }
  return null;
}

function aggregateTextStats(statsList) {
  if (!statsList.length) return null;
  const first = statsList[0];
  const keys = Object.keys(first).filter(k => k !== 'entities');
  const result = {};
  for (const key of keys) {
    const values = statsList.map(s => s[key]).filter(v => typeof v === 'number');
    if (values.length) result[key] = values.reduce((a, b) => a + b, 0) / values.length;
  }
  // Merge entities
  result.entities = {};
  for (const s of statsList) {
    if (s.entities) {
      for (const [name, count] of Object.entries(s.entities)) {
        result.entities[name] = (result.entities[name] || 0) + count;
      }
    }
  }
  return result;
}

  });
}

// ── Chapter word counts ──
function buildChapterTable() {
  const chapters = progress.chapterWordCounts || {};
  const entries = Object.entries(chapters).sort((a,b) => b[1] - a[1]);
  if (!entries.length) return '';
  return `
  <h2>Chapter Word Counts</h2>
  <div style="overflow-x:auto;">
  <table class="detail-table" style="margin-bottom:24px;">
    <thead><tr><th>Chapter</th><th class="num">Words</th><th class="num">Progress</th></tr></thead>
    <tbody>
      ${entries.map(([path, wc]) => {
        const name = path.split('/').pop().replace('.md','');
        const pct = Math.round(wc / (progress.chapterTargetWords || 2500) * 100);
        return `
        <tr style="cursor:pointer;" onclick="switchFile('${path.replace(/'/g, "\\'")}')">
          <td>${name}</td>
          <td class="num">${fmt(wc)}</td>
          <td class="num"><span style="display:inline-block;width:100px;height:6px;background:#21262d;border-radius:3px;vertical-align:middle;"><span style="display:block;height:100%;width:${Math.min(pct,100)}%;background:${pct>=100?'#3fb950':'#58a6ff'};border-radius:3px;"></span></span> ${pct}%</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>
  </div>`;
}

// ── Settings ──
function toggleSettings() {
  if (!progress) return;
  let panel = document.getElementById('settings-panel');
  if (!panel) {
    const t = progress.thresholds || {};
    const row = (label, value) =>
      `<div class="setting-row"><label>${label}</label><span class="setting-val">${value}</span></div>`
    const thRow = (label, tObj) => {
      if (!tObj) return ''
      if (tObj.goodMin !== undefined) {
        return row(label, `<span class="c-green">good</span> ${tObj.goodMin}–${tObj.goodMax} · <span class="c-orange">warn</span> ${tObj.warnMin}–${tObj.warnMax}`)
      }
      if (label.includes('TTR')) {
        return row(label, `<span class="c-green">good ≥${tObj.good}</span> · <span class="c-orange">warn ≥${tObj.warn}</span> · <span class="c-red">below</span>`)
      }
      return row(label, `<span class="c-green">good ≤${tObj.good}</span> · <span class="c-orange">warn ≤${tObj.warn}</span> · <span class="c-red">above</span>`)
    }

    panel = document.createElement('div')
    panel.id = 'settings-panel'
    panel.className = 'settings-panel'
    panel.innerHTML = `
      <h2 style="margin-bottom:16px;">Settings</h2>
      ${row('Daily Word Goal', progress.dailyGoal.toLocaleString())}
      ${row('Total Word Goal', progress.totalGoal.toLocaleString())}
      ${row('Chapter Target', (progress.chapterTargetWords || 2500).toLocaleString() + ' words')}
      ${row('Text Analysis Section', progress.textAnalysisSection || 'Manuscript')}
      ${row('Book Folder', progress.bookFolder || './Ruindykarna')}
      ${row('Exclude Patterns', 'templates/**, **/.gitkeep, **/*.base, **/.sync-conflict*')}

      <h3 style="margin-top:20px;margin-bottom:8px;font-size:0.85rem;">Metric Thresholds</h3>
      <p style="font-size:0.7rem;color:var(--text-muted);margin-bottom:10px;">
        <span class="c-green">●</span> Good · <span class="c-orange">●</span> Warning · <span class="c-red">●</span> Needs attention
      </p>
      ${thRow('Adverbs /1000w', t.adverbRatio)}
      ${thRow('Passive /1000w', t.passiveRatio)}
      ${thRow('TTR (vocabulary)', t.ttr)}
      ${thRow('LIX readability', t.lix)}
      ${thRow('Sentence Length', t.sentenceLengthAvg)}
      ${thRow('Dialogue Ratio', t.dialogueRatio)}
      ${thRow('Top-100 Word %', t.topWordFreq)}

      <p style="margin-top:18px;font-size:0.75rem;color:var(--text-muted);">
        Edit <code>bookprogress.config.json</code> to change these values, then run <code>pnpm extract</code>.
      </p>
    `
    document.getElementById('app').before(panel)
  }
  panel.classList.toggle('open')
}

// ── Helpers ──
function fmt(n) { return n.toLocaleString(); }

function calcStreak(days) {
  if (!days.length) return 0;
  let streak = 1;
  for (let i = days.length - 1; i > 0; i--) {
    const prev = new Date(days[i-1].date);
    const curr = new Date(days[i].date);
    const diff = (curr - prev) / 86400000;
    if (diff <= 1.5) streak++;
    else break;
  }
  return streak;
}

function estimateFinish(days, goalTarget) {
  if (!days.length) return { paced: null, onTrack: null }
  const total = days[days.length - 1].totalWords
  if (total >= goalTarget) return { paced: null, onTrack: null }
  const remaining = goalTarget - total
  const allTimeAvg = total / days.length
  const pacedDays = allTimeAvg > 0 ? Math.ceil(remaining / allTimeAvg) : null
  const onTrackDays = progress.dailyGoal > 0 ? Math.ceil(remaining / progress.dailyGoal) : null
  const addDays = (d) => {
    if (d === null) return null
    const dt = new Date()
    dt.setDate(dt.getDate() + d)
    return dt.toISOString().slice(0, 10)
  }
  return { paced: addDays(pacedDays), onTrack: addDays(onTrackDays) }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Start ──
document.addEventListener('mouseover', (e) => {
  const tip = e.target.closest('.has-tip')?.querySelector?.('.tip')
  if (!tip) return
  const rect = tip.getBoundingClientRect()
  const vw = window.innerWidth
  const vh = window.innerHeight
  tip.style.top = ''
  tip.style.bottom = ''
  tip.style.left = ''
  tip.style.right = ''
  tip.style.display = 'block'
  const nr = tip.getBoundingClientRect()
  tip.style.display = ''
  // Vertical: prefer above unless too close to top
  if (rect.top - nr.height - 8 < 0) {
    tip.style.top = Math.min(rect.bottom + 8, vh - nr.height - 8) + 'px'
  } else {
    tip.style.bottom = (vh - rect.top + 8) + 'px'
  }
  // Horizontal: center on trigger, clamp to viewport
  const maxW = Math.min(280, vw - 16)
  tip.style.maxWidth = maxW + 'px'
  tip.style.whiteSpace = 'normal'
  tip.style.wordWrap = 'break-word'
  let left = rect.left + rect.width / 2 - nr.width / 2
  if (left < 8) left = 8
  if (left + nr.width > vw - 8) left = vw - nr.width - 8
  tip.style.left = left + 'px'
})
refresh();
</script>
