<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --paper: #faf7f0;
    --paper-warm: #f5f0e6;
    --ink: #22211f;
    --ink-light: #5c5a55;
    --ink-faint: #b8b5ad;
    --accent: #8b6914;
    --green: #4a6741;
    --red: #9b4e43;
    --orange: #a0683a;
    --line: #e8e3d7;
    --surface: #f5f0e6;
  }
  body.dark {
    --paper: #191410;
    --ink: #d4c5a9;
    --ink-light: #8a7e6b;
    --ink-faint: #5a5040;
    --accent: #c9a96e;
    --green: #7a9a6e;
    --red: #b0685c;
    --orange: #c4956a;
    --line: #2d261e;
    --surface: #211c16;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Crimson Text', 'Georgia', 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-size: 16px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 20px;
  }
  h1 { font-size: 1.6rem; font-weight: 400; letter-spacing: -0.02em; }
  h1 em { font-style: italic; color: var(--accent); }
  h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; }
  em { font-style: italic; color: var(--accent); }

  .top-bar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-light);
    padding: 5px 12px; cursor: pointer; letter-spacing: 0.04em;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .tabs { display: flex; gap: 1px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tab {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em;
    background: none; border: none; color: var(--ink-faint); padding: 6px 14px; cursor: pointer;
    border-bottom: 1px solid transparent; margin-bottom: -1px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .card {
    background: var(--surface); border: 1px solid var(--line); padding: 14px;
    overflow: hidden;
  }
  .card .val {
    font-family: 'IBM Plex Mono', monospace; font-size: 1.4rem; font-weight: 500;
  }
  .card .lbl { font-size: 0.65rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
  .card .sub { font-size: 0.7rem; color: var(--accent); margin-top: 1px; }

  .section-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 12px;
  }
  .section-cell { background: var(--paper); padding: 12px; }
  .section-cell .val { font-family: 'IBM Plex Mono', monospace; font-size: 1.1rem; font-weight: 500; }
  .section-cell .pages { font-size: 0.7rem; color: var(--accent); }
  .section-cell .lbl { font-size: 0.6rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }

  .metric-line { position: relative; height: 52px; margin: 10px 0 18px; }
  .metric-line .track { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
  .metric-line .fill { position: absolute; left: 0; top: 50%; height: 1px; background: var(--ink); }
  .metric-line .marker { position: absolute; top: 50%; margin-left: -4px; margin-top: -5px; width: 8px; height: 10px; background: var(--ink); }
  .metric-line .mark-label { position: absolute; top: 50%; margin-top: -18px; font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--ink); transform: translateX(-50%); }
  .metric-line .ref { position: absolute; top: 50%; margin-top: -6px; width: 1px; height: 12px; background: var(--ink-faint); }
  .metric-line .ref-label { position: absolute; font-family: 'IBM Plex Mono', monospace; font-size: 0.45rem; color: var(--accent); white-space: nowrap; line-height:1.3; }

  .chapter-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .chapter-item { background: var(--paper); padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
  .chapter-item .title { flex: 1; font-style: italic; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chapter-item .bar { width: 80px; height: 2px; background: var(--line); position: relative; }
  .chapter-item .bar span { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); }
  .chapter-item .num { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--ink-faint); min-width: 70px; text-align: right; }

  .chart-wrap canvas { max-height: 180px; }
  .full { grid-column: 1 / -1; }

  .meta-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem;
    color: var(--ink-faint); letter-spacing: 0.04em; margin-top: 8px;
  }
  .theme-toggle {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem;
    background: none; border: 1px solid var(--line); color: var(--ink-faint);
    padding: 4px 10px; cursor: pointer; letter-spacing: 0.04em;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 700px) {
    .grid, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    body { padding: 12px 8px; font-size: 15px; }
    h1 { font-size: 1.3rem; }
    .card { padding: 10px; }
    .card .val { font-size: 1.2rem; }
    .section-grid { grid-template-columns: repeat(2, 1fr); }
    .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tab { padding: 5px 10px; font-size: 0.6rem; white-space: nowrap; }
    .metric-line { height: 44px; margin: 14px 0 24px; }
    .chapter-item { gap: 6px; font-size: 0.7rem; }
    .chapter-item .bar { width: 50px; }
    .chapter-item .num { min-width: 55px; font-size: 0.55rem; }
    .meta-row { font-size: 0.55rem; gap: 8px; }
    .top-bar { gap: 4px; }
  }
</style>

let progress = null;
let activeTab = 'overview';
let activeSection = 'all';

function refresh() {
  try {
    if (typeof __PROGRESS_JSON__ === 'undefined') throw new Error('No data. Run: pnpm extract');
    progress = __PROGRESS_JSON__;
    // Read tab from hash
    const hash = window.location.hash.replace('#','');
    if (['overview','style','chapters','habits'].includes(hash)) activeTab = hash;
    renderTabs();
    switchTab(activeTab);
  } catch (err) {
    document.getElementById('app').innerHTML = `<div style="color:var(--red);font-style:italic;padding:40px 0;">${err.message}</div>`;
  }
}

window.addEventListener('hashchange', () => {
  const hash = window.location.hash.replace('#','');
  if (['overview','style','chapters','habits'].includes(hash)) switchTab(hash);
});

const fmt = n => n.toLocaleString();
const pp = w => Math.round(w / (progress.wordsPerPage || 300));

function switchTab(tab) {
  activeTab = tab;
  window.location.hash = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().startsWith(tab)));
  document.getElementById('config-panel').style.display = 'none';
  renderTabs();
}

function toggleConfig() {
  const panel = document.getElementById('config-panel');
  if (panel.style.display === 'none') {
    const d = progress;
    const t = d.thresholds || {};
    panel.innerHTML = `
      <h2>Config</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;font-size:0.8rem;margin-top:8px;">
        <div><span style="color:var(--ink-faint);">Daily goal</span> <strong>${d.dailyGoal}</strong></div>
        <div><span style="color:var(--ink-faint);">Total goal</span> <strong>${fmt(d.totalGoal)}</strong></div>
        <div><span style="color:var(--ink-faint);">Chapter target</span> <strong>${d.chapterTargetWords||2500}</strong></div>
        <div><span style="color:var(--ink-faint);">Words per page</span> <strong>${d.wordsPerPage||300}</strong></div>
        <div><span style="color:var(--ink-faint);">Tracked section</span> <strong>${d.textAnalysisSection||'Manuscript'}</strong></div>
        <div><span style="color:var(--ink-faint);">Edit ratio</span> <strong>${d.editRatio}%</strong></div>
      </div>
      <div style="margin-top:8px;font-size:0.65rem;color:var(--ink-faint);">Edit <code>bookprogress.config.json</code> and run <code>pnpm extract</code> to change.</div>
    `;
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
  }
}

function renderTabs() {
  if (!progress || !progress.days.length) {
    document.getElementById('app').innerHTML = '<div style="color:var(--ink-faint);font-style:italic;padding:40px 0;">No data yet.</div>';
    return;
  }
  const d = progress;
  const days = d.days;
  const totalWords = days[days.length-1].totalWords;
  const chapterWords = Object.values(d.chapterWordCounts || {}).reduce((a,b)=>a+b,0);
  const wpp = d.wordsPerPage || 300;
  const est = d.estimatedFinish || {};
  const firstDate = new Date(days[0].date);
  const lastDate = new Date(days[days.length-1].date);
  const calendarDays = Math.round((lastDate - firstDate)/86400000)+1;
  const dailyAvg = Math.round(chapterWords / calendarDays);
  const stats = getLatestStats();
  const t = d.thresholds || {};
  const sectionGoal = d.totalGoal;
  const pct = Math.round(chapterWords / sectionGoal * 100);
  const author = d.authorName || 'I';
  const lastUpdated = new Date().toISOString().slice(0,10);

  document.getElementById('page-title').innerHTML = `${author.split(' ')[0]} <em>Writes a Book</em>`;
  document.getElementById('meta-info').innerHTML = `updated ${lastUpdated}`;

  const app = document.getElementById('app');

  if (activeTab === 'overview') {
    app.innerHTML = buildOverview(d, days, totalWords, chapterWords, sectionGoal, pct, est, dailyAvg, wpp, stats, t);
    renderProgressChart(days, totalWords, { ...d, totalGoal: sectionGoal });
    renderSessionsChart();
  } else if (activeTab === 'style') {
    app.innerHTML = buildStyle(d, stats, t, dailyAvg);
    renderStyleChart(days);
  } else if (activeTab === 'chapters') {
    app.innerHTML = buildChapters(d, wpp);
  } else if (activeTab === 'habits') {
    app.innerHTML = buildHabits(d);
    renderHoursChart();
    renderDayBoxes();
  }
}

// ── Overview ──
function buildOverview(d, days, totalWords, chapterWords, sectionGoal, pct, est, dailyAvg, wpp, stats, t) {
  return `
    <div class="grid">
      <div class="card">
        <div class="val">${fmt(chapterWords)} <em style="font-size:0.7rem;">words</em></div>
        <div class="sub">${pp(chapterWords)} pages</div>
        <div class="lbl">manuscript</div>
      </div>
      <div class="card">
        <div class="val">${pct}%</div>
        <div class="sub">${fmt(chapterWords)} of ${fmt(sectionGoal)}</div>
        <div class="lbl">progress</div>
      </div>
      <div class="card">
        <div class="val">${fmt(dailyAvg)}</div>
        <div class="lbl">avg words/day</div>
      </div>
      <div class="card">
        <div class="val">${days.length}</div>
        <div class="lbl">days writing</div>
      </div>
    </div>

    <div class="grid" style="margin-top:12px;">
      <div class="card"><h2>Progress</h2><div class="chart-wrap"><canvas id="progressChart"></canvas></div></div>
      <div class="card"><h2>Recent sessions</h2><div class="chart-wrap"><canvas id="sessionsChart"></canvas></div></div>
    </div>

    <div class="grid" style="margin-top:12px;">
      <div class="card">
        <h2>Where the words live</h2>
        <div class="section-grid">${Object.entries(d.perSection||{}).map(([name,info]) => `
          <div class="section-cell" style="cursor:pointer;opacity:${activeSection==='all'||activeSection===name?1:0.5};" onclick="switchSection('${name}')">
            <div class="val">${fmt(info.words)}</div>
            <div class="pages">${pp(info.words)} pp</div>
            <div class="lbl">${name} &middot; ${info.files} files</div>
          </div>`).join('')}</div>
      </div>
    </div>

    <div class="grid" style="margin-top:12px;">
      <div class="card full">
        <h2>Estimates</h2>
        <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:0.9rem;">
          <span>At pace: <em>${est.paced||'--'}</em></span>
          <span>On goal: <em>${est.onTrack||'--'}</em></span>
          <span>${fmt(sectionGoal - chapterWords)} words remain</span>
        </div>
      </div>
    </div>`;
}

// ── Style ──
function buildStyle(d, stats, t, dailyAvg) {
  if (!stats) return '<div class="card"><div style="color:var(--ink-faint);font-style:italic;">No manuscript data yet</div></div>';

  const metrics = [
    { label: 'Sentence length', value: Math.round(stats.sentenceLengthAvg), unit: 'w', domain: [0,45], marks: [{v:10,n:'Hemingway'},{v:15,n:'King'},{v:22,n:'Austen'},{v:38,n:'Faulkner'}] },
    { label: 'LIX readability', value: Math.round(stats.lix), unit: '', domain: [20,65], marks: [{v:25,n:'Potter'},{v:30,n:'Da Vinci'},{v:45,n:'NYT'},{v:58,n:'Academic'}] },
    { label: 'Dialogue', value: Math.round(stats.dialogueRatio), unit: '%', domain: [0,100], marks: [{v:15,n:'McCarthy'},{v:30,n:'Tolkien'},{v:40,n:'Rowling'},{v:60,n:'Hemingway'}] },
    { label: 'Passive voice', value: Math.round(stats.passiveRatio), unit: '', domain: [0,5], marks: [{v:1,n:'Hemingway'},{v:2,n:'Rowling'},{v:4,n:'NYT'},{v:5,n:'Academic'}] },
    { label: 'Adverbs', value: Math.round(stats.adverbRatio), unit: '', domain: [0,18], marks: [{v:2,n:'McCarthy'},{v:5,n:'King'},{v:10,n:'Rowling'},{v:15,n:'E.L. James'}] },
    { label: 'Vocab range', value: Math.round(stats.ttr), unit: '', domain: [30,90], marks: [{v:35,n:'Simple'},{v:44,n:'Avg fiction'},{v:55,n:'Hemingway'},{v:70,n:'Joyce'}] },
    { label: 'Rewriting', value: d.editRatio, unit: '%', domain: [0,35], marks: [{v:5,n:'Draft'},{v:12,n:'Revision'},{v:20,n:'Edit'},{v:30,n:'Polish'}] },
    { label: 'Daily writing', value: dailyAvg, unit: 'w', domain: [0,2800], marks: [{v:500,n:'Hemingway'},{v:1000,n:'Rowling'},{v:2000,n:'King'},{v:2500,n:'Sanderson'}] },
  ];

  const offsets = ['-20px','-34px','14px','28px','-8px','20px'];

  return `
    <div class="grid">
      <div class="card full"><h2>Style at a glance</h2>

        const mpct = Math.min((m.value - m.domain[0])/(m.domain[1] - m.domain[0])*100, 100);
        return `<div class="card">

          <div class="metric-line">
            <div class="track"></div>
            <div class="fill" style="width:${mpct}%"></div>
            <div class="marker" style="left:${mpct}%"></div>
            <div class="mark-label" style="left:${mpct}%">${m.value}${m.unit}</div>
            ${m.marks.map((mk,mi) => {
              const rpct = (mk.v - m.domain[0])/(m.domain[1] - m.domain[0])*100;
              const top = '31px';
              return `<div class="ref" style="left:${rpct}%"></div><div class="ref-label" style="left:${rpct}%;top:31px;text-align:center;"><span style="display:block;">${mk.n}</span><span style="display:block;font-size:0.4rem;">${mk.v}${m.unit}</span></div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// ── Chapters ──
function buildChapters(d, wpp) {
  const chapters = d.chapterWordCounts || {};
  const target = d.chapterTargetWords || 2500;
  const sorted = Object.entries(chapters).sort((a,b) => a[0].localeCompare(b[0]));
  return `
    <div class="grid">
      <div class="card full"><h2>Chapter word counts</h2>
        <div class="chapter-list">
          ${sorted.map(([path, wc]) => {
            const name = path.split('/').pop().replace('.md','');
            const cpct = Math.min(Math.round(wc/target*100),100);
            return `<div class="chapter-item">
              <span class="title">${name}</span>
              <div class="bar"><span style="width:${cpct}%"></span></div>
              <span class="num">${fmt(wc)} w &middot; ${pp(wc)} pp</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
}

// ── Habits ──
function buildHabits(d) {
  return `
    <div class="grid">
      <div class="card"><h2>When I write</h2><div class="chart-wrap"><canvas id="hoursChart"></canvas></div></div>
      <div class="card"><h2>Which days I show up</h2><div id="dayBoxes"></div></div>
    </div>`;
}

// ── Charts ──
function renderProgressChart(days, totalWords, d) {
  const ctx = document.getElementById('progressChart');
  if (!ctx) return;
  const dark = document.body.classList.contains('dark');
  const ink = dark?'#d4c5a9':'#22211f';
  const grid = dark?'#2d261e':'#e8e3d7';
  const faint = dark?'#c9a96e':'#8b6914';
  const goalCol = dark?'#3a3228':'#d8d3c7';
  const labels = days.map(d=>d.date);
  const paceBase = d.dailyGoal;
  const est = d.estimatedFinish||{};
  const dailyAvg = totalWords/days.length;
  const extLabels=[...labels], extActual=days.map(d=>d.totalWords), extGoal=days.map((_,i)=>paceBase*(i+1)), extPace=days.map((_,i)=>paceBase*(i+1));
  const lastDate=new Date(days[days.length-1].date);
  const onTrackDate=est.onTrack?new Date(est.onTrack):null;
  const pacedDate=est.paced?new Date(est.paced):null;
  const endDate=(onTrackDate&&pacedDate)?new Date(Math.max(onTrackDate,pacedDate)):(onTrackDate||pacedDate||new Date(Date.now()+30*86400000));
  const cursor=new Date(lastDate);cursor.setDate(cursor.getDate()+1);
  let pGoal=totalWords,pPace=totalWords;
  while(cursor<=endDate){extLabels.push(cursor.toISOString().slice(0,10));extActual.push(null);pGoal=Math.min(pGoal+paceBase,d.totalGoal);pPace=Math.min(pPace+dailyAvg,d.totalGoal);extGoal.push(pGoal);extPace.push(pPace);cursor.setDate(cursor.getDate()+1);}
  Chart.getChart('progressChart')?.destroy();
  new Chart(ctx,{type:'line',data:{labels:extLabels,datasets:[{data:extActual,borderColor:ink,borderWidth:1.5,pointRadius:1,pointBackgroundColor:dark?'#c9a96e':'#8b6914',tension:0.2,spanGaps:false},{data:extLabels.map(()=>d.totalGoal),borderColor:goalCol,borderWidth:1,borderDash:[4,8],pointRadius:0},{data:extGoal,borderColor:dark?'#7a9a6e33':'#c0d6b8',borderWidth:1,borderDash:[2,6],pointRadius:0},{data:extPace,borderColor:dark?'#c9a96e33':'#d4c8a8',borderWidth:1,borderDash:[1,8],pointRadius:0}]},options:{responsive:!0,animation:{duration:1200,easing:'easeInOutQuart'},plugins:{legend:{display:!1}},scales:{x:{ticks:{color:faint,maxTicksLimit:8,font:{family:'IBM Plex Mono',size:9}},grid:{color:grid}},y:{ticks:{color:faint,font:{family:'IBM Plex Mono',size:9}},grid:{color:grid}}}}});
}

function renderSessionsChart() {
  const ctx=document.getElementById('sessionsChart');
  if(!ctx)return;
  const dark=document.body.classList.contains('dark');
  const ink=dark?'#c9a96e':'#8b6914';
  const grid=dark?'#2d261e':'#e8e3d7';
  const faint=dark?'#c9a96e':'#8b6914';
  const recent=progress.days.slice(-10);
  Chart.getChart('sessionsChart')?.destroy();
  new Chart(ctx,{type:'bar',data:{labels:recent.map(d=>d.date.slice(5)),datasets:[{data:recent.map(d=>d.wordsNet),backgroundColor:recent.map(d=>d.wordsNet>0?ink:grid),borderWidth:0,borderRadius:0}]},options:{responsive:!0,animation:{duration:800,easing:'easeInOutQuart'},plugins:{legend:{display:!1}},scales:{x:{ticks:{color:faint,font:{family:'IBM Plex Mono',size:9}},grid:{display:!1}},y:{ticks:{color:faint,font:{family:'IBM Plex Mono',size:9}},grid:{color:grid}}}}});
}

function renderStyleChart(days) {
  const ctx=document.getElementById('styleChart');
  if(!ctx)return;
  const dark=document.body.classList.contains('dark');
  const ink=dark?'#d4c5a9':'#22211f';
  const gold=dark?'#c9a96e':'#8b6914';
  const grid=dark?'#2d261e':'#e8e3d7';
  const faint=dark?'#c9a96e':'#8b6914';
  const withStats=days.filter(d=>d.textStats);
  Chart.getChart('styleChart')?.destroy();
  new Chart(ctx,{type:'line',data:{labels:withStats.map(d=>d.date),datasets:[{data:withStats.map(d=>d.textStats.sentenceLengthAvg),borderColor:ink,borderWidth:1.5,pointRadius:0,tension:0.2},{data:withStats.map(d=>d.textStats.lix),borderColor:gold,borderWidth:1,pointRadius:0,tension:0.2,borderDash:[3,5]},{data:withStats.map(d=>d.textStats.dialogueRatio),borderColor:dark?'#7a9a6e':'#4a6741',borderWidth:1,pointRadius:0,tension:0.2}]},options:{responsive:!0,animation:{duration:1000,easing:'easeInOutQuart'},plugins:{legend:{display:!1}},scales:{x:{ticks:{color:faint,maxTicksLimit:6,font:{family:'IBM Plex Mono',size:9}},grid:{color:grid}},y:{ticks:{color:faint,font:{family:'IBM Plex Mono',size:9}},grid:{color:grid}}}}});
}

function renderHoursChart() {
  const ctx=document.getElementById('hoursChart');
  if(!ctx)return;
  const dark=document.body.classList.contains('dark');
  const ink=dark?'#c9a96e':'#8b6914';
  const grid=dark?'#2d261e':'#e8e3d7';
  const faint=dark?'#c9a96e':'#8b6914';
  const hours=progress.commitHours||{};
  const labels=Array.from({length:24},(_,i)=>i);
  Chart.getChart('hoursChart')?.destroy();
  new Chart(ctx,{type:'bar',data:{labels:labels.map(h=>`${h}`),datasets:[{data:labels.map(h=>hours[h]||0),backgroundColor:labels.map(h=>(hours[h]||0)>0?ink:grid),borderWidth:0,borderRadius:0}]},options:{responsive:!0,animation:{duration:800,easing:'easeInOutQuart'},plugins:{legend:{display:!1}},scales:{x:{ticks:{color:faint,font:{family:'IBM Plex Mono',size:9}},grid:{display:!1}},y:{ticks:{color:faint,font:{family:'IBM Plex Mono',size:9}},grid:{color:grid}}}}});
}

function renderDayBoxes() {
  const el=document.getElementById('dayBoxes');
  if(!el)return;
  const dayShort=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dayCounts=[0,0,0,0,0,0,0];
  for(const day of progress.days){const d=new Date(day.date).getDay();const idx=d===0?6:d-1;dayCounts[idx]++;}
  const max=Math.max(...dayCounts,1);
  el.innerHTML=`<div class="section-grid" style="margin-top:8px;">${dayShort.map((name,i)=>{const intensity=dayCounts[i]/max;return`<div class="section-cell" style="position:relative;"><div style="position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--accent);opacity:${(intensity*0.35).toFixed(2)};"></div><div class="val" style="position:relative;color:var(--accent);font-size:0.9rem;">${name}</div><div class="pages" style="position:relative;">${dayCounts[i]}</div></div>`}).join('')}</div>`;
}

// ── Utils ──
const getLatestStats = () => { for(let i=progress.days.length-1;i>=0;i--){if(progress.days[i].textStats)return progress.days[i].textStats;} return null; };

function toggleTheme() {
  document.body.classList.toggle('dark');
  document.querySelector('.theme-toggle').textContent = document.body.classList.contains('dark') ? 'light' : 'dark';
  renderTabs();
}

function switchSection(section) {
  activeSection = activeSection === section ? 'all' : section;
  renderTabs();
}

function share() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: 'Writing Tracker', url });
  } else {
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.querySelector('.btn');
      btn.textContent = 'copied';
      setTimeout(() => btn.textContent = 'share this page', 2000);
    });
  }
}

refresh();
</script>
